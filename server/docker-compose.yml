version: '3.8'

services:
  # Main Backend Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maatram_api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/maatram_db?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/maatram_db?schema=public
      - JWT_ACCESS_SECRET=prod_access_secret_change_me_12345
      - JWT_REFRESH_SECRET=prod_refresh_secret_change_me_67890
    depends_on:
      - db
    restart: always

  # Local PostgreSQL instance (fallback when not using remote Supabase)
  db:
    image: postgres:16-alpine
    container_name: maatram_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=maatram_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
